name: Spring Boot CI - Nexus & GHCR

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: [self-hosted, springboot-runner]
    # Runner is Windows: default shell for `run:` is PowerShell, so all scripts below are PowerShell.
    defaults:
      run:
        shell: powershell
    env:
      # Pass secrets as env vars instead of inlining ${{ }} into scripts, so characters
      # like $ ` " in a password are not interpreted by PowerShell.
      NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      JAVA_HOME: C:\Program Files\Java\jdk-21.0.12.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # JDK 21 is preinstalled on the runner (no setup-java: its download from api.adoptium.net
      # is broken by Kaspersky HTTPS inspection). Put the JDK first on PATH for later steps.
      - name: Use preinstalled JDK 21
        run: |
          "$env:JAVA_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          java -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mvn -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Project .mvn/settings.xml holds the Nexus mirror; it reads credentials from
      # NEXUS_USERNAME / NEXUS_PASSWORD (job env above).
      - name: Build and deploy JAR to Nexus
        run: |
          # Quote -D args: PowerShell splits unquoted -Dfoo.bar=... at the dot
          mvn -B -s .mvn/settings.xml clean deploy `
            "-DaltReleaseDeploymentRepository=nexus-releases::http://$($env:NEXUS_HOST):8081/repository/maven-release/" `
            "-DaltSnapshotDeploymentRepository=nexus-snapshots::http://$($env:NEXUS_HOST):8081/repository/maven-snapshot/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # docker/login-action passes the password to docker directly (no PowerShell pipe).
      # Registry = host:port, no http:// prefix.
      - name: Login to Nexus Docker (pull - docker-group 8083)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_HOST }}:8083
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Login to Nexus Docker (push - docker-hosted 8082)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_HOST }}:8082
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image to Nexus and GHCR (WINDOWS)
        run: |
          $ErrorActionPreference = 'Stop'
          $tag        = "${{ github.sha }}"
          $owner      = "${{ github.repository_owner }}".ToLower()   # GHCR requires lowercase
          $nexusImage = "$($env:NEXUS_HOST):8082/springboot-poc:$tag"
          $ghcrImage  = "ghcr.io/$owner/springboot-poc:$tag"

          docker build --build-arg "NEXUS_HOST=$env:NEXUS_HOST" -t $nexusImage -t $ghcrImage .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker push $nexusImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker push $ghcrImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }